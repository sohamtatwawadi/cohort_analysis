<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ImpactOmics · Cohort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">

  <header class="top">
    <!-- Wordmark. The "o" is the brand glyph: a ring with two nodes on a bond
         through it. Set as text plus one inline SVG rather than an image file so
         it stays crisp at any density and inherits the header's own colour. -->
    <div class="logo">
      <span class="wm" aria-label="Impactomics">Impact<svg class="wm-o" viewBox="0 0 24 24"
          role="img" aria-hidden="true" focusable="false">
          <circle class="ring" cx="12" cy="12" r="6.4"/>
          <line x1="9.4" y1="14.6" x2="14.6" y2="9.4"/>
          <circle class="node" cx="15.4" cy="8.6" r="2.3"/>
          <circle class="node" cx="8.7" cy="15.3" r="1.6"/>
        </svg>mics</span>
      <span class="sub">Cohort</span>
    </div>

    <div class="modes" id="modes" role="tablist" aria-label="Data source">
      <button role="tab" data-mode="lab" class="on" aria-selected="true">Our lab data</button>
      <button role="tab" data-mode="research" aria-selected="false">Uploaded data</button>
    </div>

    <div class="grow"></div>
    <button class="ghost" id="askBtn">Ask a question <kbd>⌘K</kbd></button>
    <button class="ghost" id="helpBtn" aria-label="What is this?">?</button>
  </header>

  <!-- The spine: one job, four steps, always visible. -->
  <nav class="steps" id="steps" aria-label="Workflow"></nav>

  <div class="cohortbar" id="cohortbar"></div>

  <main class="stage" id="stage" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>

</div>

<div id="modalRoot"></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/static/js/flow.js"></script>
</body>
</html>
