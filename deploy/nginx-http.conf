# Reverse proxy, plain HTTP — for a demo reached by EC2 IP, where Let's Encrypt
# cannot issue a certificate because there is no domain name.
#
# Basic auth over plain HTTP sends the password in base64 over the wire, which
# is not encryption. That is acceptable ONLY because the security group should
# also restrict port 80 to your own IP. It is not acceptable for a link you send
# to someone else — point a hostname at the instance and use deploy/nginx.conf
# with certbot instead.

server {
    listen 80 default_server;
    server_name _;

    # The application has no authentication of its own, so this is the only
    # thing between it and whoever can reach the port.
    auth_basic           "ImpactOmics Cohort";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # A VCF or PLINK fileset is large; nginx's 1 MB default rejects a real
    # upload with a bare 413 and no explanation in the UI.
    client_max_body_size 2g;
    client_body_timeout  300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analyses run in a background thread and the UI polls, so no request is
        # long-lived — but the very first request after an empty-database boot
        # waits on the store seeding itself.
        proxy_read_timeout 300s;
    }
}
