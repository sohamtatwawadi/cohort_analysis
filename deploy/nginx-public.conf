# Public demo — no password, anyone with the link can use it.
#
# The application has no authentication, so with auth_basic removed every
# endpoint is anonymous, including the ones that destroy data. This config keeps
# the demo fully usable while closing off the parts that cannot be undone:
#
#   blocked   admin rebuild      wipes and reseeds the entire store
#   blocked   every DELETE       removes datasets, cohorts and their payloads
#   blocked   upload / ingest    fills the disk, 2 GB at a time
#   allowed   everything else    including running analyses — that IS the demo
#
# Running an analysis is left open deliberately: it is the point of the tool, it
# is recoverable with a restart, and a visitor who clicks Run is the demo
# working. Uploading and deleting are not recoverable, so they go.
#
# Use this INSTEAD OF nginx-http.conf (they both claim port 80):
#   sudo rm /etc/nginx/conf.d/cohort.conf
#   sudo cp deploy/nginx-public.conf /etc/nginx/conf.d/cohort.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The security group must also allow port 80 from 0.0.0.0/0 for anyone to reach
# it. Leave 22 and 8085 restricted to your own IP.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 8m;        # no real uploads here; keep a junk POST small
    client_body_timeout  60s;

    # ---- irreversible operations, refused ---------------------------------
    # Ordered before the catch-all location. nginx picks the longest matching
    # prefix, so these win for the paths they name.

    # Rebuilding the store would destroy the demo mid-presentation.
    location /api/admin/ {
        return 403 '{"detail":"Disabled on the public demo."}';
        default_type application/json;
    }

    # Upload and ingest are the two ways to put bytes on the disk.
    location ~ ^/api/research/projects/[^/]+/datasets/(upload|ingest)$ {
        return 403 '{"detail":"Uploads are disabled on the public demo."}';
        default_type application/json;
    }

    location / {
        # DELETE is never needed to look at a cohort, and every DELETE in this
        # app removes data and its derived results.
        if ($request_method = DELETE) {
            return 403 '{"detail":"Deleting is disabled on the public demo."}';
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
