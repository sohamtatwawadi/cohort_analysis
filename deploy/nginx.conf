# Reverse proxy in front of the app. Two jobs: terminate TLS, and be the place
# access control lives — the application has none of its own.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cohort.example.com;          # <- your hostname

    # certbot --nginx will fill these in.
    ssl_certificate     /etc/letsencrypt/live/cohort.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cohort.example.com/privkey.pem;

    # The app has no login. Until it does, this is the only thing between it and
    # the internet:
    #   sudo htpasswd -c /etc/nginx/.htpasswd demo
    auth_basic           "ImpactOmics Cohort";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # A VCF or PLINK fileset is large; the default 1 MB cap rejects real
    # uploads with a bare 413.
    client_max_body_size 2g;
    client_body_timeout  300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An analysis runs in the background and the UI polls, so no request is
        # long-lived — but a cold first request seeds the store, which is.
        proxy_read_timeout 300s;
    }
}
